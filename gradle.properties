# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# R8 full mode (§6.2): more aggressive tree shaking, class merging, and
# argument propagation. Evaluated against the release build gate — if
# assembleRelease or the instrumentation tests break, revert this flag.
android.enableR8.fullMode=true

# Kotlin
kotlin.code.style=official
