name: Instrumentation (device tier)

# Sprint 1c.3 — the Android device execution of the shared SSE engine spec
# (SseEngineAndroidIntegrationTest + AndroidNetworkingCharacteristicsTest).
# Separate workflow file so the pull_request `paths:` filter applies to the
# whole lane; the nightly cron below always runs the full device suite.
# CI-lane hardening: the lane also gates the Sprint 1d production Keystore
# vault (KeystoreVaultAndroidTest — real AndroidKeyStore AES-GCM, the only
# device-level coverage for code the JVM suite structurally cannot reach),
# captures logcat evidence on failure, and runs on every push to main so the
# first post-merge state is always device-verified.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/anomalyco/opencode/data/remote/**'
      - 'app/src/main/java/com/anomalyco/opencode/data/settings/**'
      - 'app/src/main/java/com/anomalyco/opencode/di/**'
      - 'app/src/sharedTest/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/android-test.yml'
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-test:
    name: Device tier (API 34 emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Build OFF-emulator first: connectedDebugAndroidTest otherwise compiles
      # the whole app (~50 tasks) on 2 runner vCPUs while the instrumented
      # tests are ALREADY racing inside the emulator — the starvation tripled
      # loopback socket latencies (first run: 3 timing-only test failures that
      # all passed on retry; zero network errors in the 6 MB device logcat).
      # Prebuilding makes the connected step install-and-run only.
      - name: Build app + instrumentation APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --stacktrace

      # KVM setup: github-hosted ubuntu-24.04 runners expose /dev/kvm but
      # the runner user is not in the kvm group by default. The
      # android-emulator-runner action (disable-linux-hw-accel: auto) probes
      # /dev/kvm via fs.accessSync(R_OK|W_OK) before spawning the emulator;
      # without write access it falls back to -accel off (software x86_64
      # emulation), which boots API 34 in 590-900+ s — a coin flip against
      # the default 600 s emulator-boot-timeout.  chmod 666 is the only fix
      # that works here: the action's node process inherits supplementary
      # groups at startup so usermod+newgrp arrives too late, whereas device
      # file permissions are checked per-call.  Safe on single-use CI runners.
      - name: Configure KVM
        run: |
          sudo chmod 666 /dev/kvm
          ls -la /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm && echo "KVM accessible" || echo "KVM not accessible"

      # logcat must be captured INSIDE the runner step (the emulator is torn
      # down once it exits). The script runs under `sh -e`, so the gradle
      # exit code MUST be harvested via `|| status=$?` — a bare `cmd; s=$?`
      # aborts at `cmd` and skips the capture (proven by first-run attempt 2
      # uploading nothing). NEVER use `|| true` on gradle: real failures
      # must fail the lane; the app's own logging is sanitizer-gated, this
      # is plain failure evidence and the lane runs secret-free.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # Root-cause sizing (attempts 4-6 artifacts): the guest booted with
          # the emulator's DEFAULT 2 vCPU / ~2.5 GB while the multi-step SSE
          # chains need real scheduling headroom (per-test logcat showed
          # 130-260 ms ART verification per touched class even warm). The
          # ubuntu-latest host offers 4 cores / 16 GB — give the guest the
          # machine instead of inflating test deadlines past the evidence.
          cores: 4
          ram-size: 4096
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -no-snapshot-save -gpu swiftshader_indirect -camera-back none
          script: |
            status=0
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace || status=$?
            adb logcat -d -v brief > device-logcat.txt || true
            adb logcat -d -b crash -v brief > device-crashlog.txt || true
            exit $status

      - name: Upload device logcat (failure evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-logcat
          path: |
            device-logcat.txt
            device-crashlog.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload instrumentation results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/outputs/androidTest-results/connected/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload instrumentation report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: app/build/reports/androidTests/connected/
          retention-days: 14
          if-no-files-found: ignore
